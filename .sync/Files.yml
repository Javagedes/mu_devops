# Specifies the files synced from Mu DevOps to other Project Mu repositories.
#
# This file is meant to ensure common configuration across Project Mu repos that is centralized in Mu DevOps.
#
# Files are contributed directly in Mu DevOps by the original author and then automatically synced after the PR
# in Mu DevOps is merged by UEFI Bot to all of the repos specified in this file.
#
# To maintain consistency across Project Mu, always consider if a configuration/settings file is appropriate as
# a common file in Mu DevOps or should be repo-specific.
#
# Copyright (c) Microsoft Corporation.
# SPDX-License-Identifier: BSD-2-Clause-Patent
#
# For more information, see:
# https://github.com/BetaHuhn/repo-file-sync-action

# Maintenance: Keep labels groups in ascending alphabetical order - easier to scan, identify duplicates, etc.

# Azure Pipelines - Common Configs
#
# These files leverage a high degree of common build template reuse from Mu DevOps. It is preferred that repos
# use the common templates for pipelines and adjust template parameter inputs as needed for a specific repo. However,
# a repo can always be removed from this list and manage its pipeline YAML files completely independently if absolutely
# necessary.
#
# Note: The fact that these files are copied to a repo does not mean that the repo has pipelines
#       set up to use the YAML file. The file is simply available for pipelines to be connected
#       if needed.
group:
# Leaf Workflow - CLANGPDB Package CI (mu_basecore)
  - files:
    - source: .sync/workflows/leaf/clangpdb-ci.yml
      dest: test/clangpdb-ci1.yml
      template:
        setup_cmd: setup
        package_config: |
          - packages: MdeModulePkg
            targets: RELEASE
            toolchain: CLANGPDB
          - packages: MdeModulePkg
            targets: DEBUG
            toolchain: CLANGPDB
    repos: |
      javagedes/mu_devops

# Leaf Workflow - CLANGPDB Package CI (mu_common_intel_min_platform)
  - files:
    - source: .sync/workflows/leaf/clangpdb-ci.yml
      dest: test/clangpdb-ci2.yml
      template:
        setup_cmd: ci-setup
    repos: |
      javagedes/mu_devops

# Leaf Workflow - CLANGPDB Package CI (mu_crypto_release)
  - files:
    - source: .sync/workflows/leaf/clangpdb-ci.yml
      dest: test/clangpdb-ci3.yml
      template:
        branch: main
        setup_cmd: both
        package_config: |
          - packages: OneCryptoPkg
            targets: NO-TARGET
            toolchain: CLANGPDB
          - packages: MbedTlsPkg
            targets: NO-TARGET
            toolchain: CLANGPDB
          - packages: MbedTlsPkg
            targets: DEBUG
            toolchain: CLANGPDB
          - packages: MbedTlsPkg
            targets: RELEASE
            toolchain: CLANGPDB
          - packages: OpensslPkg
            targets: NO-TARGET
            toolchain: CLANGPDB
          - packages: OpensslPkg
            targets: DEBUG
            toolchain: CLANGPDB
          - packages: OpensslPkg
            targets: RELEASE
            toolchain: CLANGPDB
    repos: |
      javagedes/mu_devops

# Leaf Workflow - CLANGPDB Package CI (feature repos)
  - files:
    - source: .sync/workflows/leaf/clangpdb-ci.yml
      dest: test/clangpdb-ci4.yml
      template:
        branch: main
        setup_cmd: both
    repos: |
      javagedes/mu_devops

# Leaf Workflow - CLANGPDB Package CI (mu_oem_sample, mu_plus)
  - files:
    - source: .sync/workflows/leaf/clangpdb-ci.yml
      dest: test/clangpdb-ci5.yml
      template:
        setup_cmd: ci-setup
    repos: |
      javagedes/mu_devops

# Leaf Workflow - CLANGPDB Package CI (mu_tiano_platforms)
  - files:
    - source: .sync/workflows/leaf/clangpdb-ci.yml
      dest: test/clangpdb-ci6.yml
      template:
        branch: main
        setup_cmd: ci-setup
    repos: |
      javagedes/mu_devops